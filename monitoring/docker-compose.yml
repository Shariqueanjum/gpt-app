# PickOpinion monitoring stack:
#   logs:    Loki (stores logs) + Alloy (reads log files) + Grafana (shows them)
#   numbers: Prometheus (stores metrics) + node-exporter (server) + cAdvisor (Docker containers)
#            + postgres-exporter (Postgres statistics, read-only user)
# Separate Compose project ("monitoring"): does not touch the gpt-app project / gpt-site-db container.
# Everything is bound to 127.0.0.1 and has CPU + memory caps so the website can never be starved.
name: monitoring

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loki:
    image: grafana/loki:3.7.4
    command: -config.file=/etc/loki/loki-config.yml
    environment:
      - GOMEMLIMIT=300MiB
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

  alloy:
    image: grafana/alloy:v1.22.0
    user: "0:0"   # needed to read /root/.pm2/logs (root-only); all mounts below are read-only
    command: >
      run --server.http.listen-addr=0.0.0.0:12345
      --storage.path=/var/lib/alloy/data
      /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /root/.pm2/logs:/pm2logs:ro
      - /var/log/nginx:/nginxlogs:ro
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    environment:
      - GOMEMLIMIT=220MiB
    depends_on:
      - loki
    mem_limit: 320m
    cpus: 0.3
    restart: unless-stopped
    logging: *default-logging

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      - GOMEMLIMIT=250MiB
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in monitoring/.env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_LOG_LEVEL=warn
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - loki
    mem_limit: 320m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.13.5
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=3GB
      - --web.listen-address=0.0.0.0:9090
    environment:
      - GOMEMLIMIT=200MiB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run|var/lib/docker/.+|var/lib/containerd/.+)($$|/)
    pid: host            # lets it read the real server's process/mount information (read-only use)
    environment:
      - GOMEMLIMIT=40MiB
    volumes:
      - /:/host:ro,rslave
    mem_limit: 64m
    cpus: 0.2
    restart: unless-stopped
    logging: *default-logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0
    privileged: true      # documented way to let cAdvisor read container stats
    devices:
      - /dev/kmsg:/dev/kmsg
    command:
      - --housekeeping_interval=30s
      - --docker_only=true
      - --disable_metrics=percpu,sched,tcp,udp,advtcp,process,hugetlb,referenced_memory,cpu_topology,resctrl
    environment:
      - GOMEMLIMIT=120MiB
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    mem_limit: 160m
    cpus: 0.3
    restart: unless-stopped
    logging: *default-logging

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    command:
      - --collector.postmaster
    environment:
      - DATA_SOURCE_URI=gpt-site-db:5432/gpt_db?sslmode=disable
      - DATA_SOURCE_USER=pickopinion_monitor
      - DATA_SOURCE_PASS=${POSTGRES_EXPORTER_PASSWORD}
      - GOMEMLIMIT=40MiB
    networks:
      - default      # lets Prometheus reach the exporter
      - gpt-app      # lets the exporter reach the Postgres container (read-only statistics user)
    mem_limit: 64m
    cpus: 0.2
    restart: unless-stopped
    logging: *default-logging

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  gpt-app:
    external: true          # the Postgres project's existing network; this file never creates or deletes it
    name: gpt-app_default
