# Prometheus: collects numbers (CPU, memory, disk, containers) every 30 s and keeps them 30 days.
# Targets are reached by service name inside the "monitoring" Compose network. Nothing here is public.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # The server itself: CPU, memory, swap, disk, load (node_exporter)
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # Docker containers: memory and CPU per container (cAdvisor)
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Postgres statistics (postgres_exporter, read-only user pickopinion_monitor)
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # The Node app: prom-client /metrics on a private port. 172.17.0.1 is the host's Docker bridge address;
  # the app listens ONLY there (METRICS_HOST / METRICS_PORT in server/.env), never on the public IP.
  - job_name: gptapp
    static_configs:
      - targets: ['172.17.0.1:9464']
